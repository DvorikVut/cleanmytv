appId: io.github.wingedpanther.cleanmytv
productName: CleanMyTV
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/upstream
    to: upstream
  - from: resources/launcher.apk
    to: launcher.apk
  - from: resources/launcher.json
    to: launcher.json
  - from: resources/signing
    to: signing
# Fuses are switches baked into the Electron binary. Off: running the app as plain Node, NODE_OPTIONS
# and --inspect, which would let another program borrow the app's identity and network permission.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  # onlyLoadAppFromAsar stays off: with it the unsigned build exits at launch, and it adds little
  # without code signing and asar integrity checks.
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  # The scan and ADB connection reach devices on the home network.
  extendInfo:
    NSLocalNetworkUsageDescription: CleanMyTV connects to your Android TV on your home network.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  target: AppImage
